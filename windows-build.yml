name: Build Nova Laser Quote Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r nova_laser_quote/requirements.txt pyinstaller
      - name: Build executable
        working-directory: nova_laser_quote
        run: pyinstaller --noconfirm --clean --onedir --name NovaLaserQuote --add-data "templates;templates" --collect-all extract_msg launcher.py
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path nova_laser_quote/dist/NovaLaserQuote/* -DestinationPath NovaLaserQuote-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NovaLaserQuote-Windows
          path: NovaLaserQuote-Windows.zip
