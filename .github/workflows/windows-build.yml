
name: Build Nova Laser Quote Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onedir --name NovaLaserQuote  --collect-all extract_msg launcher.py

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NovaLaserQuote/* -DestinationPath NovaLaserQuote-Windows.zip

      - name: Upload finished application
        uses: actions/upload-artifact@v4
        with:
          name: NovaLaserQuote-Windows
          path: NovaLaserQuote-Windows.zip
